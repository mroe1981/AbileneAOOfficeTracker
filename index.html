<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Office Tracker</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#0f1117;
  color:#eef0f8;
  max-width:500px;
  margin:auto;
}

.card{
  background:#191d27;
  padding:15px;
  margin:10px;
  border-radius:10px;
  border:1px solid #333;
}

input, select{
  width:100%;
  padding:10px;
  margin-top:5px;
  background:#222;
  border:1px solid #444;
  color:white;
  border-radius:8px;
}

button{
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:10px;
  cursor:pointer;
}

.primary{
  background:#5b8df6;
  color:white;
}

.entry{
  background:#191d27;
  border:1px solid #333;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

.overdue{
  border:2px solid red;
}
</style>

</head>

<body>

<div class="card">
<h2>Office Tracker</h2>

<input id="name" placeholder="Name">
<input id="dest" placeholder="Where are you going?">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">

<select id="status">
  <option value="">Select Status</option>
  <option>Out of Office</option>
  <option>Meeting</option>
  <option>Lunch</option>
  <option>Remote</option>
</select>

<button class="primary" onclick="addEntry()">Add Entry</button>
</div>

<div class="card">
<h3>Active Entries</h3>
<div id="list"></div>
</div>

<div class="card">
<button onclick="exportCSV()">Download CSV</button>
</div>

<script>

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyByRJQCvWgb39z8kvuDYiJODiAM_qezU8A",
  authDomain: "abl-ao--solo-worker-tracker.firebaseapp.com",
  projectId: "abl-ao--solo-worker-tracker",
  storageBucket: "abl-ao--solo-worker-tracker.firebasestorage.app",
  messagingSenderId: "949187929232",
  appId: "1:949187929232:web:d5fc3f6e7537a4da3de415",
  measurementId: "G-E4H3LZZRZ9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const entriesRef = db.collection("entries");

let entries = [];

/* REALTIME */
entriesRef.onSnapshot(function(snapshot){
  entries = [];
  snapshot.forEach(function(doc){
    entries.push({ id: doc.id, data: doc.data() });
  });
  render();
});

/* FILTER */
function isActive(e){
  const today = new Date().toISOString().split("T")[0];
  const d = (e.logged || "").split("T")[0];
  return d === today || !e.returned;
}

/* RENDER */
function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  entries.filter(i=>isActive(i.data)).forEach(function(item){
    const e = item.data;

    const last = new Date(e.lastCheckIn || e.logged);
    const mins = Math.floor((Date.now()-last)/60000);
    const overdue = !e.returned && mins > 120;

    let html = "<div class='entry "+(overdue?"overdue":"")+"'>";

    html += "<b>"+e.name+"</b><br>";
    html += "Destination: "+e.dest+"<br>";
    html += "Phone: "+e.phone+"<br>";
    html += "Email: "+e.email+"<br>";
    html += "Last check-in: "+mins+" min ago<br>";

    if(e.checkins){
      html += "Check-ins: "+e.checkins.length+"<br>";
    }

    if(overdue){
      html += "<span style='color:red'>OVERDUE</span><br>";
    }

    if(e.returned){
      html += "<b>"+(e.returnNote||"")+"</b>";
    } else {
      html += "<button onclick=\"markReturned('"+item.id+"')\">Back</button> ";
      html += "<button onclick=\"markNotAlone('"+item.id+"')\">Not Alone</button> ";
      html += "<button onclick=\"markAloneOk('"+item.id+"')\">Alone OK</button>";
    }

    html += "</div>";
    list.innerHTML += html;
  });
}

/* ADD ENTRY WITH HISTORY */
function addEntry(){
  const name = val("name");
  const dest = val("dest");
  const phone = val("phone");
  const email = val("email");
  const status = val("status");

  if(!name || !dest || !phone || !email || !status){
    return alert("Fill all fields");
  }

  const now = new Date().toISOString();

  entriesRef.add({
    name, dest, phone, email, status,
    logged: now,
    lastCheckIn: now,
    checkins: [now],   // ✅ START HISTORY
    returned:false,
    alerted:false
  });

  alert("Saved ✅");
}

/* CHECK-IN TRACKING */
function markAloneOk(id){

  const now = new Date().toISOString();

  entriesRef.doc(id).get().then(function(doc){
    if(!doc.exists) return;

    const data = doc.data();
    const history = data.checkins || [];

    history.push(now);

    entriesRef.doc(id).update({
      lastCheckIn: now,
      checkins: history
    });
  });
}

/* ACTIONS */
function markReturned(id){
  entriesRef.doc(id).update({
    returned:true,
    returnNote:"Back"
  });
}

function markNotAlone(id){
  entriesRef.doc(id).update({
    returned:true,
    returnNote:"Not Alone"
  });
}

/* ALERT */
setInterval(function(){
  entries.forEach(function(item){
    const e=item.data;
    if(e.returned) return;

    const last=new Date(e.lastCheckIn||e.logged);
    const mins=(Date.now()-last)/60000;

    if(mins>120 && !e.alerted){
      alert(e.name+" overdue");
      entriesRef.doc(item.id).update({alerted:true});
    }
  });
},60000);

/* EXPORT WITH HISTORY + STATUS */
function exportCSV(){

  let csv = "Name,Destination,Phone,Email,Status,Check-In History\n";

  entries.forEach(function(item){
    const e = item.data;

    const history = (e.checkins || [])
      .map(t => new Date(t).toLocaleString())
      .join(" | ");

    csv += `"${e.name}","${e.dest}","${e.phone}","${e.email}","${e.status}","${history}"\n`;
  });

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "office-tracker.csv";
  a.click();
}

/* HELPER */
function val(id){
  return document.getElementById(id).value.trim();
}

</script>

</body>
</html>
``
