<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>B.E.A.C.O.N.</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#0f1117;
  color:#eef0f8;
  max-width:500px;
  margin:auto;
}

.card{
  background:#191d27;
  padding:15px;
  margin:10px;
  border-radius:10px;
  border:1px solid #333;
}

input{
  width:100%;
  padding:10px;
  margin-top:5px;
  background:#222;
  border:1px solid #444;
  color:white;
  border-radius:8px;
}

button{
  padding:8px;
  border-radius:8px;
  border:none;
  margin-top:6px;
  cursor:pointer;
}

.primary{
  background:#5b8df6;
  color:white;
}

.entry{
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}

.safe{
  border:2px solid #2ecc71;
  background:#13291c;
}

.warning{
  border:2px solid #f1c40f;
  background:#2c260e;
}

.overdue{
  border:2px solid red;
  background:#2a1515;
}
</style>

</head>

<body>

<div class="card">
<h2>B.E.A.C.O.N.</h2>
<div style="font-size:12px; color:#aaa;">
  Backup Employee Activity Check-In & Observation Network
</div>
``

<input id="name" placeholder="Name">
<input id="dest" placeholder="Where are you going?">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email (optional)">
<input id="notes" placeholder="Notes (optional)">

<input id="supervisorCode" placeholder="Supervisor Code (optional - supervisors only)">
<button onclick="setSupervisor()">Enable Supervisor</button>

<button class="primary" onclick="addEntry()">Add Entry</button>
</div>

<div class="card">
<h3>Active Entries</h3>
<div id="list"></div>
</div>

<div class="card">
<h3>Export CSV (Date Range)</h3>

<label>Start Date:</label>
<input type="date" id="startDate">

<label>End Date:</label>
<input type="date" id="endDate">

<button onclick="exportCSV()">Download CSV</button>
</div>

<script>

/* USER ID */
let userId = localStorage.getItem("userId");
if(!userId){
  userId = crypto.randomUUID();
  localStorage.setItem("userId", userId);
}

/* SUPERVISOR */
let isSupervisor = localStorage.getItem("isSupervisor") === "true";

function setSupervisor(){
  const code = document.getElementById("supervisorCode").value;

  if(code === "0851"){
    localStorage.setItem("isSupervisor", "true");
    isSupervisor = true;
    alert("Supervisor enabled");
    render();
  } else {
    alert("Invalid code");
  }
}

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyByRJQCvWgb39z8kvuDYiJODiAM_qezU8A",
  authDomain: "abl-ao--solo-worker-tracker.firebaseapp.com",
  projectId: "abl-ao--solo-worker-tracker"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const entriesRef = db.collection("entries");

let entries = [];

entriesRef.onSnapshot(function(snapshot){
  entries = [];
  snapshot.forEach(function(doc){
    entries.push({ id: doc.id, data: doc.data() });
  });
  render();
});

/* FILTER */
function isActive(e){
  const today = new Date().toISOString().split("T")[0];
  const d = (e.logged||"").split("T")[0];
  return d === today || !e.returned;
}

/* RENDER */
function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  entries.filter(i=>isActive(i.data)).forEach(function(item){
    const e = item.data;

    const last = new Date(e.lastCheckIn || e.logged);
    const mins = Math.floor((Date.now()-last)/60000);

    let statusClass = "safe";
    let statusText = "SAFE";

    if(mins > 120){
      statusClass = "overdue";
      statusText = "OVERDUE";
    } else if(mins > 90){
      statusClass = "warning";
      statusText = "CHECK SOON";
    }

    let html = "<div class='entry "+statusClass+"'>";

    html += "<b>"+e.name+"</b> ("+statusText+")<br>";
    html += "Destination: "+e.dest+"<br>";
    html += "Phone: "+e.phone+"<br>";

    if(e.email){
      html += "Email: "+e.email+"<br>";
    }

    if(e.notes){
      html += "Notes: "+e.notes+"<br>";
    }

    html += "Last check-in: "+mins+" min ago<br>";

    if(e.checkins){
      html += "Check-ins: "+e.checkins.length+"<br>";
    }

    if(e.returned){
      html += "<b>"+(e.returnNote||"")+"</b>";
    } else {

      if(e.userId === userId || isSupervisor){

        html += "<button onclick=\"markReturned('"+item.id+"')\">Back</button>";
        html += "<button onclick=\"markNotAlone('"+item.id+"')\">Not Alone</button>";
        html += "<button onclick=\"markAloneOk('"+item.id+"')\">Check-In</button>";

        if(isSupervisor){
          html += "<button onclick=\"resetAlert('"+item.id+"')\">Reset Alert</button>";
          html += "<button onclick=\"forceReturn('"+item.id+"')\">Force Return</button>";
        }

      } else {
        html += "<i>Controlled by another user</i>";
      }

    }

    html += "</div>";
    list.innerHTML += html;
  });
}

/* ADD ENTRY */
function addEntry(){

  const name = val("name");
  const dest = val("dest");
  const phone = val("phone");
  const email = val("email");
  const notes = val("notes");

  if(!name || !dest || !phone){
    return alert("Fill required fields");
  }

  const now = new Date().toISOString();

  entriesRef.add({
    name,
    dest,
    phone,
    email,
    notes,
    userId: userId,
    logged: now,
    lastCheckIn: now,
    checkins: [now],
    returned:false,
    alerted:false
  });

  alert("Saved");
}

/* CHECK-IN */
function markAloneOk(id){
  const now = new Date().toISOString();

  entriesRef.doc(id).get().then(function(doc){
    if(!doc.exists) return;

    const history = doc.data().checkins || [];
    history.push(now);

    entriesRef.doc(id).update({
      lastCheckIn: now,
      checkins: history
    });
  });
}

/* ACTIONS */
function markReturned(id){
  entriesRef.doc(id).update({
    returned:true,
    returnNote:"Back"
  });
}

function markNotAlone(id){
  entriesRef.doc(id).update({
    returned:true,
    returnNote:"Not Alone"
  });
}

/* SUPERVISOR */
function resetAlert(id){
  entriesRef.doc(id).update({alerted:false});
}

function forceReturn(id){
  entriesRef.doc(id).update({
    returned:true,
    returnNote:"Supervisor Override"
  });
}

/* ALERT */
setInterval(function(){
  entries.forEach(function(item){
    const e=item.data;
    if(e.returned) return;

    const last=new Date(e.lastCheckIn||e.logged);
    const mins=(Date.now()-last)/60000;

    if(mins>120 && !e.alerted){
      alert(e.name+" overdue");
      entriesRef.doc(item.id).update({alerted:true});
    }
  });
},60000);

/* EXPORT */
function exportCSV(){

  const start = document.getElementById("startDate").value;
  const end = document.getElementById("endDate").value;

  let csv = "Name,Destination,Phone,Email,Notes,Check-In History\n";

  entries.forEach(function(item){
    const e = item.data;

    const loggedDate = e.logged ? e.logged.split("T")[0] : "";

    if(start && loggedDate < start) return;
    if(end && loggedDate > end) return;

    const history = (e.checkins || [])
      .map(t => new Date(t).toLocaleString())
      .join(" | ");

    csv += `"${e.name}","${e.dest}","${e.phone}","${e.email || ''}","${e.notes || ''}","${history}"\n`;
  });

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "office-tracker.csv";
  a.click();
}

function val(id){
  return document.getElementById(id).value.trim();
}

</script>

</body>
</html>
